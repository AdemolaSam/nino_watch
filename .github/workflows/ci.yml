name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nino
          POSTGRES_PASSWORD: nino
          POSTGRES_DB: nino
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://nino:nino@localhost:5432/nino_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run python scripts/create_test_db.py
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python scripts/smoke.py

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest
    concurrency: backend-production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Oracle VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          for value in VPS_HOST VPS_USER VPS_SSH_KEY VPS_HOST_KEY; do
            if [[ -z "${!value}" ]]; then
              echo "Missing GitHub secret: $value" >&2
              exit 1
            fi
          done
          install -m 700 -d "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/id_ed25519"
          if ! printf '%s\n' "$VPS_HOST_KEY" | awk -v host="$VPS_HOST" '
            $1 ~ /^(ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa)$/ {
              print host, $1, $2
              found = 1
            }
            $2 ~ /^(ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa)$/ {
              print host, $2, $3
              found = 1
            }
            END { if (!found) exit 1 }
          ' > "$RUNNER_TEMP/deploy-ssh/known_hosts"; then
            echo "VPS_HOST_KEY must contain the VPS public host key, not its fingerprint." >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/deploy-ssh/id_ed25519" "$RUNNER_TEMP/deploy-ssh/known_hosts"
          if ! ssh-keygen -l -f "$RUNNER_TEMP/deploy-ssh/known_hosts" > /dev/null; then
            echo "VPS_HOST_KEY is not a valid SSH public host key." >&2
            exit 1
          fi
          ssh -i "$RUNNER_TEMP/deploy-ssh/id_ed25519" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" "bash -se -- $GITHUB_SHA" < scripts/deploy_vps.sh
