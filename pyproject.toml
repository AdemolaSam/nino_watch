[project]
name = "ninowatch-backend"
version = "0.1.0"
description = "NiñoWatch backend: ingest, verify, advise"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "feedparser>=6.0.11",
    "flower>=2.0",
    "httpx>=0.27",
    "langdetect>=1.0.9",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "trafilatura>=1.9",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI dependency injection requires Depends() in argument defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
